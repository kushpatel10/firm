# Nginx reverse proxy configuration for Firm Platform
# Place this file in /etc/nginx/sites-available/firm and symlink to /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name your-domain.com www.your-domain.com; # <-- Replace with your domain or VPS IP

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3000; # Next.js frontend (which proxies /api to port 4000)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
